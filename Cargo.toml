[package]
name = "yoauth"
version = "0.1.0"
edition = "2021"
authors = ["Peter Výboch <pvyboch1@gmail.com>"]
license = "MIT"
description = "Getting a token has never been easier - Rust edition"

[dependencies]
tiny_http = "0.12"
rustls = { version = "0.23", features = ["aws-lc-rs"] }
rustls-pemfile = "2.1"
rcgen = "0.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = { version = "2.10", features = ["json"] }
url = "2.5"
webbrowser = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
toml = "0.8"
rand = "0.8"
sha2 = "0.10"
base64 = "0.22"
