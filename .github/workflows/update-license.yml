name: Update license year

on:
  schedule:
    - cron: '0 3 1 1 *'  # 03:00 on Jan 1 (UTC)
  workflow_dispatch:      # allow manual run

permissions:
  contents: write
  pull-requests: write

jobs:
  update-license-year:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: FantasticFiasco/action-update-license-year@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # path: "LICENSE"         # default; adjust if needed
          # transform: "<custom-regex>"  # only if license format is nonstandard
